services:
  web:
    image: nginx:alpine
    container_name: axolotl-web
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  status:
    build: ./status
    container_name: axolotl-status
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - web
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: axolotl-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - status
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: axolotl-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
