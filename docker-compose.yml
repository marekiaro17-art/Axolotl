services:
  web:
    image: nginx:alpine
    container_name: axolotl-web
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3

  status:
    build: ./status
    container_name: axolotl-status
    ports:
      - "8080:8080"
    depends_on:
      - web
    restart: unless-stopped
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/status"]
      interval: 10s
      timeout: 3s
      retries: 3

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: axolotl-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
